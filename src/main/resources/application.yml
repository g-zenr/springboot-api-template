spring:
  application:
    name: springboot-api-template
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    access:
      # Boot 4: set access (do not also set endpoint.*.enabled — mutually exclusive)
      default: read_only
    web:
      exposure:
        # health/info public; metrics/prometheus require authentication (see SecurityConfig)
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      access: read_only
    prometheus:
      access: read_only
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Reusable Spring Boot API template
    encoding: UTF-8

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: false
  security:
    seed-demo-users: true
    allow-registration: true
    # Authorization model: rbac (default) | abac — both implementations ship; switch only
    authorization:
      mode: ${AUTHZ_MODE:rbac}
    jwt:
      secret: ${JWT_SECRET:change-me-template-jwt-secret-key-32b!}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  rate-limit:
    enabled: true
    login-requests-per-minute: 20
    api-requests-per-minute: 120
  # Async executor off by default — set true only for fire-and-forget jobs (email, webhooks)
  async:
    enabled: false

logging:
  level:
    root: INFO
    com.template.api: INFO

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:template;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
app:
  security:
    seed-demo-users: true
    allow-registration: true
  rate-limit:
    # High limits so automated tests do not trip 429
    login-requests-per-minute: 1000
    api-requests-per-minute: 5000

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/template}
    username: ${DB_USER:template}
    password: ${DB_PASSWORD:template}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost}
    allow-credentials: true
  security:
    seed-demo-users: ${SEED_DEMO_USERS:false}
    allow-registration: ${ALLOW_REGISTRATION:false}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  rate-limit:
    enabled: true
    login-requests-per-minute: ${RATE_LIMIT_LOGIN_PER_MIN:10}
    api-requests-per-minute: ${RATE_LIMIT_API_PER_MIN:100}
logging:
  level:
    root: WARN
    com.template.api: INFO
