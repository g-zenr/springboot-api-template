name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same branch (saves queue + downloads)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Faster short-lived CI JVMs; quieter Maven logs
  MAVEN_OPTS: -XX:+TieredCompilation -XX:TieredStopAtLevel=1
  # Skip Testcontainers Postgres IT in default CI (avoids pulling docker images every run)
  # Run locally with Docker: ./mvnw test  (includes ItemPostgresIT when Docker is available)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            pom.xml
            .mvn/wrapper/maven-wrapper.properties

      # Wrapper dists live under ~/.m2/wrapper (only-script wrapper downloads Maven once, then cache hits)
      - name: Cache Maven wrapper distributions
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: ${{ runner.os }}-mvnw-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mvnw-

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      # One Maven process: reuses reactor + local repo; -ntp hides transfer spam
      # Excludes *IT (Testcontainers) for speed; H2 tests still run fully
      - name: Spotless check and tests
        run: ./mvnw -B -ntp spotless:check test -Dsurefire.excludes=**/*IT.java
