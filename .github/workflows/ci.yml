name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Ensure wrapper is executable (Windows checkouts may lose +x without git filemode)
      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Spotless check
        run: ./mvnw -B spotless:check

      - name: Run tests
        run: ./mvnw -B test
